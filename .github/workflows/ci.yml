name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Syntax and documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install weather-service dependencies
        run: python -m pip install -r weather-service/requirements.txt
      - name: Check JavaScript syntax
        run: |
          node --check backend/src/server.js
          for file in frontend/*.js; do node --check "$file"; done
      - name: Check Python and shell syntax
        run: |
          python -m compileall -q weather-service/app weather-service/tests
          bash -n test-e2e.sh
          bash -n scripts/test-admin-bootstrap.sh
      - name: Test weather-service normalization and cache
        run: PYTHONPATH=weather-service python -m unittest discover -s weather-service/tests -v
      - name: Check HTML and documentation links
        run: python scripts/check_project.py
